<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const MUSIC_URL=''; // optional: put a link to your own English song (mp3) here
if(!window.THREE){$('err').textContent='Could not load the 3D engine. Check your internet connection and reload.'}
else try{
/* ---------- save data ---------- */
let S={coins:0,color:0,eng:0,top:0,best:{},units:'kmh',vol:.55,mute:false,diff:1};
try{Object.assign(S,JSON.parse(localStorage.getItem('elite_sc')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('elite_sc',JSON.stringify(S))}catch(e){}};
const COLORS=[0xd4001f,0x111111,0xc9ced6,0x1f6bff,0xe0b13a,0x7a3cff];
const DIFF=['EASY','MEDIUM','HARD'],AIV=[54,64,74];

/* ---------- renderer / scene ---------- */
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:devicePixelRatio<2});
R.setPixelRatio(Math.min(devicePixelRatio,1.75));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0620);scene.fog=new THREE.FogExp2(0x0b0724,.0042);
const cam=new THREE.PerspectiveCamera(65,1,.1,1600);
scene.add(new THREE.HemisphereLight(0x7a6cff,0x10101c,1.0));
const moon=new THREE.DirectionalLight(0xa9bcff,.7);moon.position.set(-200,300,100);scene.add(moon);
const moonM=new THREE.Mesh(new THREE.SphereGeometry(40,24,16),new THREE.MeshBasicMaterial({color:0xdfe8ff,fog:false}));moonM.position.set(-500,420,700);scene.add(moonM);
{const p=[];for(let i=0;i<500;i++){const a=Math.random()*6.28,e=Math.random()*1.3+.1;p.push(Math.cos(a)*900*Math.cos(e),Math.sin(e)*900,Math.sin(a)*900*Math.cos(e))}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:2,color:0xffffff,fog:false})))}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(3200,3200),new THREE.MeshStandardMaterial({color:0x0c0e1a,roughness:.9}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const grid=new THREE.GridHelper(3200,160,0x2a3cff,0x1a1f55);grid.position.y=.02;grid.material.transparent=true;grid.material.opacity=.35;scene.add(grid);

/* ---------- track ---------- */
const CP=[[0,0],[160,-30],[280,60],[320,200],[240,320],[90,300],[10,400],[-150,350],[-240,220],[-170,90],[-70,50]].map(a=>new THREE.Vector3(a[0],0,a[1]));
const curve=new THREE.CatmullRomCurve3(CP,true,'catmullrom',.5),N=400,HW=9;
const pts=curve.getSpacedPoints(N).slice(0,N),TL=curve.getLength(),SP=TL/N;
const tan=pts.map((p,i)=>pts[(i+1)%N].clone().sub(pts[(i+N-1)%N]).setY(0).normalize());
const curv=pts.map((p,i)=>Math.acos(Math.min(1,tan[(i+N-4)%N].dot(tan[(i+4)%N]))));
function ribbon(a,b,y,mat,f){const pos=[],idx=[];for(let i=0;i<N;i++){const p=pts[i],t=tan[i],nx=t.z,nz=-t.x;pos.push(p.x+nx*a,y,p.z+nz*a,p.x+nx*b,y,p.z+nz*b)}
 for(let i=0;i<N;i++){if(f&&!f(i))continue;const j=(i+1)%N;idx.push(i*2,i*2+1,j*2,i*2+1,j*2+1,j*2)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();const m=new THREE.Mesh(g,mat);m.material.side=THREE.DoubleSide;scene.add(m)}
ribbon(-HW,HW,.05,new THREE.MeshStandardMaterial({color:0x1b1c26,roughness:.55,metalness:.3}));
ribbon(HW-.8,HW,.07,new THREE.MeshBasicMaterial({color:0x18f0ff}));ribbon(-HW,-HW+.8,.07,new THREE.MeshBasicMaterial({color:0xff2d6f}));
ribbon(-.25,.25,.07,new THREE.MeshBasicMaterial({color:0xffffff}),i=>i%8<4);
function nearest(x,z,step=1){let bi=0,bd=1e9;for(let i=0;i<N;i+=step){const dx=pts[i].x-x,dz=pts[i].z-z,d=dx*dx+dz*dz;if(d<bd){bd=d;bi=i}}return{i:bi,d:Math.sqrt(bd)}}

/* ---------- modern city ---------- */
function winTex(){const c=document.createElement('canvas');c.width=64;c.height=128;const g=c.getContext('2d');g.fillStyle='#07080f';g.fillRect(0,0,64,128);
 for(let y=4;y<128;y+=8)for(let x=4;x<64;x+=8)if(Math.random()<.45){g.fillStyle=['#ffd27a','#7ad7ff','#ff7ad9','#ffffff'][Math.random()*4|0];g.fillRect(x,y,4,5)}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const WT=[winTex(),winTex(),winTex()];
const NEON=[0x18f0ff,0xff2d6f,0x8b5cff,0xffb02d];
let placed=0,tries=0;
while(placed<130&&tries<2000){tries++;const x=(Math.random()-.5)*1300,z=(Math.random()-.5)*1300+120;
 if(nearest(x,z,5).d<38)continue;
 const w=14+Math.random()*22,d=14+Math.random()*22,h=18+Math.random()*Math.random()*150;
 const t=WT[placed%3].clone();t.needsUpdate=true;t.repeat.set(w/8,h/16);
 const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:0x151a30,roughness:.6,metalness:.4,emissive:0xffffff,emissiveMap:t,emissiveIntensity:.85,map:null}));
 b.position.set(x,h/2,z);scene.add(b);
 const top=new THREE.Mesh(new THREE.BoxGeometry(w+.6,.8,d+.6),new THREE.MeshBasicMaterial({color:NEON[placed%4]}));top.position.set(x,h+.4,z);scene.add(top);placed++}
const lampG=new THREE.CylinderGeometry(.12,.15,9,6),lampM=new THREE.MeshStandardMaterial({color:0x333845}),headM=new THREE.MeshBasicMaterial({color:0xffe3a0});
for(let i=0;i<N;i+=10)for(const s of[-1,1]){const p=pts[i],t=tan[i],x=p.x+t.z*s*(HW+3),z=p.z-t.x*s*(HW+3);
 const l=new THREE.Mesh(lampG,lampM);l.position.set(x,4.5,z);scene.add(l);const h=new THREE.Mesh(new THREE.BoxGeometry(1.4,.25,.5),headM);h.position.set(x-t.z*s*.6,9,z+t.x*s*.6);h.rotation.y=Math.atan2(t.x,t.z);scene.add(h)}
function bbTex(txt,col){const c=document.createElement('canvas');c.width=256;c.height=96;const g=c.getContext('2d');g.fillStyle='#07070f';g.fillRect(0,0,256,96);g.strokeStyle=col;g.lineWidth=6;g.strokeRect(4,4,248,88);g.fillStyle=col;g.font='bold 40px sans-serif';g.textAlign='center';g.fillText(txt,128,62);return new THREE.CanvasTexture(c)}
['ELITE','NITRO','PHONK FM','NEON CITY','DRIFT'].forEach((tx,k)=>{const i=(k*80+30)%N,p=pts[i],t=tan[i],s=k%2?1:-1,x=p.x+t.z*s*(HW+9),z=p.z-t.x*s*(HW+9);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(16,6),new THREE.MeshBasicMaterial({map:bbTex(tx,'#'+NEON[k%4].toString(16).padStart(6,'0')),side:THREE.DoubleSide}));m.position.set(x,9,z);m.rotation.y=Math.atan2(t.x,t.z)+Math.PI/2*0;scene.add(m);
 for(const o of[-6,6]){const po=new THREE.Mesh(new THREE.BoxGeometry(.4,6,.4),lampM);po.position.set(x+t.x*o,3,z+t.z*o);scene.add(po)}});
{const p=pts[0],t=tan[0],a=Math.atan2(t.x,t.z);const c=document.createElement('canvas');c.width=64;c.height=8;const g=c.getContext('2d');for(let i=0;i<16;i++)for(let j=0;j<2;j++){g.fillStyle=(i+j)%2?'#fff':'#000';g.fillRect(i*4,j*4,4,4)}
 const ct=new THREE.CanvasTexture(c);const line=new THREE.Mesh(new THREE.PlaneGeometry(HW*2,2),new THREE.MeshBasicMaterial({map:ct}));line.rotation.set(-Math.PI/2,0,-a);line.rotation.order='YXZ';line.rotation.set(-Math.PI/2,0,0);line.rotation.y=0;
 const grp=new THREE.Group();grp.position.set(p.x,0,p.z);grp.rotation.y=a;grp.add(line);line.position.y=.09;line.rotation.set(-Math.PI/2,0,0);
 const beam=new THREE.Mesh(new THREE.BoxGeometry(HW*2+4,1.2,1),new THREE.MeshBasicMaterial({color:0xff2d6f}));beam.position.y=9;grp.add(beam);
 for(const s of[-1,1]){const po=new THREE.Mesh(new THREE.BoxGeometry(.8,9,.8),lampM);po.position.set(s*(HW+2),4.5,0);grp.add(po)}scene.add(grp)}

/* ---------- car model ---------- */
function makeCar(hex){
 const g=new THREE.Group(),body=new THREE.Group();g.add(body);
 const paint=new THREE.MeshStandardMaterial({color:hex,metalness:.85,roughness:.2}),dark=new THREE.MeshStandardMaterial({color:0x0b0b10,metalness:.5,roughness:.4}),
 glass=new THREE.MeshStandardMaterial({color:0x0e1a26,metalness:1,roughness:.05}),tail=new THREE.MeshBasicMaterial({color:0x661018}),head=new THREE.MeshBasicMaterial({color:0xeaf6ff});
 const add=(geo,m,x,y,z,rx=0,p=body)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.rotation.x=rx;p.add(o);return o},B=(w,h,l)=>new THREE.BoxGeometry(w,h,l);
 add(B(1.9,.4,4.4),paint,0,.55,0);add(B(1.8,.2,1.7),paint,0,.8,1.35,.14);add(B(1.75,.2,1.2),paint,0,.82,-1.55,-.1);
 add(B(1.55,.42,1.6),glass,0,1.0,-.2);add(B(1.4,.06,1.3),paint,0,1.24,-.2);add(B(1.5,.05,.95),glass,0,1.1,.72,.75);add(B(1.5,.05,.9),glass,0,1.1,-1.08,-.7);
 add(B(2.0,.06,.5),dark,0,.32,2.25);add(B(.12,.16,2.7),dark,.99,.34,0);add(B(.12,.16,2.7),dark,-.99,.34,0);add(B(1.7,.12,.5),dark,0,.34,-2.2);
 add(B(2.0,.07,.55),paint,0,1.28,-2.1);add(B(.07,.4,.12),dark,.65,1.08,-2.05);add(B(.07,.4,.12),dark,-.65,1.08,-2.05);
 add(B(.5,.1,.08),head,.62,.72,2.2);add(B(.5,.1,.08),head,-.62,.72,2.2);add(B(1.7,.09,.06),tail,0,.78,-2.22);
 add(B(.18,.12,.3),paint,1.05,.98,.5);add(B(.18,.12,.3),paint,-1.05,.98,.5);
 const ex=new THREE.CylinderGeometry(.09,.09,.3,10);add(ex,new THREE.MeshStandardMaterial({color:0xaaaaaa,metalness:1,roughness:.2}),.5,.4,-2.25,Math.PI/2);add(ex,dark,-.5,.4,-2.25,Math.PI/2);
 const glow=new THREE.Mesh(new THREE.PlaneGeometry(2.4,4.8),new THREE.MeshBasicMaterial({color:0x18f0ff,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false}));glow.rotation.x=-Math.PI/2;glow.position.y=.1;g.add(glow);
 const tire=new THREE.CylinderGeometry(.4,.4,.34,24),rim=new THREE.CylinderGeometry(.27,.27,.36,20),tm=new THREE.MeshStandardMaterial({color:0x080808,roughness:.9}),rm=new THREE.MeshStandardMaterial({color:0xd6dbe6,metalness:1,roughness:.2}),spk=B(.37,.5,.05);
 const piv=[],spin=[];
 [[1,1.4],[-1,1.4],[1,-1.35],[-1,-1.35]].forEach((w,k)=>{const pv=new THREE.Group();pv.position.set(w[0]*1.0,.4,w[1]);g.add(pv);const sp=new THREE.Group();pv.add(sp);
  const t=new THREE.Mesh(tire,tm);t.rotation.z=Math.PI/2;sp.add(t);const r=new THREE.Mesh(rim,rm);r.rotation.z=Math.PI/2;sp.add(r);
  for(let q=0;q<5;q++){const s=new THREE.Mesh(spk,dark);s.rotation.x=q*Math.PI*2/5;s.position.x=w[0]*.02;sp.add(s)}
  const cal=new THREE.Mesh(B(.1,.16,.2),new THREE.MeshBasicMaterial({color:0xff2d3a}));cal.position.set(-w[0]*.12,.28,0);pv.add(cal);
  spin.push(sp);if(k<2)piv.push(pv)});
 return{g,body,piv,spin,tail,glow,paint}}
let player=makeCar(COLORS[S.color]);scene.add(player.g);
let ais=[];
function recolor(){player.paint.color.setHex(COLORS[S.color])}

/* ---------- smoke ---------- */
const stex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,2,32,32,32);gr.addColorStop(0,'#fff');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const smoke=[];for(let i=0;i<36;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:stex,transparent:true,opacity:0,depthWrite:false,color:0xdddddd}));s.userData.l=0;scene.add(s);smoke.push(s)}
let si=0;function puff(x,z){const s=smoke[si++%smoke.length];s.position.set(x,.35,z);s.userData.l=1;s.scale.setScalar(1)}

/* ---------- audio: phonk music + engine ---------- */
let AC,mus,eng,engG,nbuf,step=0,nextT=0,fileAudio=null;
function setVol(){if(mus)mus.gain.value=S.mute?0:S.vol*.9;if(fileAudio)fileAudio.volume=S.mute?0:S.vol}
function tone(ty,f1,f2,t,d,v,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest||mus);o.start(t);o.stop(t+d+.02)}
function noise(t,d,v,hp){const s=AC.createBufferSource();s.buffer=nbuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(mus);s.start(t);s.stop(t+d+.02)}
const BASS=[43.65,43.65,51.91,38.89],LEAD=[349.2,415.3,466.2,523.3,466.2,415.3,349.2,311.1];
function sched(){while(nextT<AC.currentTime+.25){const t=nextT,s=step%16,bar=(step>>4)%4;
 if([0,6,10].includes(s)){tone('sine',150,45,t,.25,.9);}
 if([0,3,6,10,12].includes(s)){tone('sine',BASS[bar]*2,BASS[bar]*2*.97,t,.38,.7)}
 if([0,3,6,8,11,14].includes(s)){tone('square',587,587,t,.16,.07);tone('square',845,845,t,.16,.07)}
 if(s==4||s==12){noise(t,.14,.5,1200)}if(s%2==0||s>13)noise(t,.04,.12,7000);
 if(s%2==0)tone('triangle',LEAD[(s/2+bar*2)%8|0],LEAD[(s/2+bar*2)%8|0],t,.3,.06);
 nextT+=60/132/4;step++}}
function initAudio(){if(AC)return;
 if(MUSIC_URL){try{fileAudio=new Audio(MUSIC_URL);fileAudio.loop=true;setVol();fileAudio.play()}catch(e){}}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();mus=AC.createGain();mus.connect(AC.destination);setVol();
 nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 eng=AC.createOscillator();eng.type='sawtooth';const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=700;engG=AC.createGain();engG.gain.value=0;eng.connect(f);f.connect(engG);engG.connect(AC.destination);eng.start();
 if(!MUSIC_URL){nextT=AC.currentTime+.1;setInterval(sched,60)}}catch(e){}}
function sfx(f,d,v){if(AC)tone('square',f,f/3,AC.currentTime,d,v,AC.destination)}

/* ---------- game state ---------- */
const K={};let T={L:0,R:0,G:0,B:0,H:0,N:0};
let state='menu',mode='quick',car,ai,camMode=0,camH=0,steerCur=0,spin=0,smokeT=0;
car={x:0,z:0,h:0,vx:0,vz:0,nit:100};
const tot=3;let lap=1,done=0,cpI=0,timer=0,lapT=0,best=1e9,cd=0,drift=0,stuck=0,prog=0,fin=false,finT=0,finPos=0,msgT=0;
const CPS=[100,200,300,0];
const $s={};['spd','unit','gear','rpm','rb','nb','tl','msg'].forEach(i=>$s[i]=$(i));
function fmt(t){if(!isFinite(t)||t>9e8)return'--:--.---';const m=t/60|0;return m+':'+(t%60).toFixed(3).padStart(6,'0')}
function place(i,off){const p=pts[i%N],t=tan[i%N];return{x:p.x+t.z*off,z:p.z-t.x*off,h:Math.atan2(t.x,t.z)}}
function startRace(m){mode=m;initAudio();if(AC&&AC.state==='suspended')AC.resume();
 ais.forEach(a=>scene.remove(a.m.g));ais=[];
 if(m==='quick')[[6,-3,1],[9,3,2],[12,-3,3]].forEach((a,k)=>{const c=makeCar(COLORS[(S.color+a[2])%COLORS.length]);c.glow.visible=false;scene.add(c.g);ais.push({m:c,s:a[0],off:a[1],v:0,k:.94+Math.random()*.08,fin:false})});
 const g=m==='free'?{x:pts[0].x,z:pts[0].z,h:Math.atan2(tan[0].x,tan[0].z)}:place(3,3);
 Object.assign(car,{x:g.x,z:g.z,h:g.h,vx:0,vz:0,nit:100});steerCur=0;lap=1;done=0;cpI=0;timer=0;lapT=0;best=S.best[m]||1e9;drift=0;fin=false;stuck=0;
 cd=3.99;state='count';$('menu').classList.remove('on');$('res').classList.remove('on');$('pause').classList.remove('on');$('hud').classList.add('on');$('mm').style.display='block';
 recolor()}
function toMenu(){state='menu';['hud'].forEach(i=>$(i).classList.remove('on'));['pause','res'].forEach(i=>$(i).classList.remove('on'));$('menu').classList.add('on');ais.forEach(a=>scene.remove(a.m.g));ais=[];ui()}
function finish(){state='done';const all=[done*N+0];let pos=1;ais.forEach(a=>{if(a.fin)pos++});finPos=pos;
 let reward=0,lines='';
 if(mode==='quick'){reward=[400,250,150,80][pos-1]||80;lines+=`Position: <b>${pos} / ${ais.length+1}</b><br>`}else reward=150;
 const db=Math.floor(drift/12);if(db)lines+=`Drift bonus: <b>+${db}</b><br>`;
 if(best<1e9&&best<(S.best[mode]||1e9)){S.best[mode]=best;reward+=100;lines+=`🏆 New personal best! <b>+100</b><br>`}
 reward+=db;S.coins+=reward;save();
 $('rt').textContent=mode==='quick'?(pos==1?'YOU WIN!':'FINISHED P'+pos):'COMPLETE';
 $('rb2').innerHTML=lines+`Total time: <b>${fmt(timer)}</b><br>Best lap: <b>${fmt(best)}</b> (saved PB: ${fmt(S.best[mode])})<br>Coins earned: <b>+${reward}</b>`;$('res').classList.add('on')}

/* ---------- main update ---------- */
function update(dt){
 const up=1+.12*S.eng,topM=78*(1+.06*S.top);
 if(state==='count'){cd-=dt;const n=Math.ceil(cd);$s.msg.textContent=n>0?n:'GO!';if(cd<=0){state='race';msgT=1}}
 else if(state==='race'||state==='done'){if(msgT>0){msgT-=dt;if(msgT<=0)$s.msg.textContent=''}}
 const racing=state==='race';
 let thr=racing&&(K.KeyW||K.ArrowUp||T.G)?1:0,brk=racing&&(K.KeyS||K.ArrowDown||T.B)?1:0,hb=racing&&(K.Space||T.H)?1:0,nit=racing&&(K.ShiftLeft||K.ShiftRight||T.N)&&car.nit>0&&thr?1:0;
 const sin=Math.sin(car.h),cos=Math.cos(car.h);let fx=sin,fz=cos,lx=cos,lz=-sin;
 let vf=car.vx*fx+car.vz*fz,vl=car.vx*lx+car.vz*lz;
 const si=racing?((K.KeyA||K.ArrowLeft||T.L?1:0)-(K.KeyD||K.ArrowRight||T.R?1:0)):0;
 steerCur+=(si-steerCur)*Math.min(1,dt*7);
 const mx=topM*(nit?1.15:1);
 if(thr)vf+=26*up*(nit?1.8:1)*Math.max(0,1-vf/mx)*dt*(vf<0?2:1);
 if(brk){vf-=(vf>1?55:22)*dt;if(vf<-18)vf=-18}
 vf-=vf*(thr?.05:.35)*dt+Math.sign(vf)*2*dt*(thr?0:1);if(Math.abs(vf)<.3&&!thr&&!brk)vf=0;
 vl*=Math.exp(-(hb?1.1:7.5)*dt);if(hb)vf*=Math.exp(-.35*dt);
 nit?car.nit=Math.max(0,car.nit-35*dt):car.nit=Math.min(100,car.nit+7*dt);
 const yaw=steerCur*2.0*Math.min(1,Math.abs(vf)/8)/(1+Math.abs(vf)/38)*(vf>=0?1:-1)*(hb?1.7:1);
 car.h+=yaw*dt;
 const s2=Math.sin(car.h),c2=Math.cos(car.h);fx=s2;fz=c2;lx=c2;lz=-s2;
 car.vx=fx*vf+lx*vl;car.vz=fz*vf+lz*vl;car.x+=car.vx*dt;car.z+=car.vz*dt;
 const gate=mode!=='free';
 if(gate){const nr=nearest(car.x,car.z);if(nr.d>HW+1){const k=Math.min(1,(nr.d-HW)/10);car.vx*=1-1.2*dt*k;car.vz*=1-1.2*dt*k}
  if(nr.d>HW+9){const p=pts[nr.i],dx=p.x-car.x,dz=p.z-car.z,l=Math.hypot(dx,dz);car.x+=dx/l*(nr.d-HW-9);car.z+=dz/l*(nr.d-HW-9);car.vx*=.9;car.vz*=.9;sfx(90,.1,.15)}
  if(racing){const tgt=CPS[cpI];let dd=Math.abs(nr.i-tgt);dd=Math.min(dd,N-dd);
   if(dd<9){cpI++;if(cpI>=4){cpI=0;const lt=timer-lapT;lapT=timer;if(lt<best)best=lt;done++;if(done>=tot){fin=true;finish()}else{lap=done+1;sfx(880,.3,.2)}}else sfx(660,.12,.15)}
   prog=done*N+nr.i}}
 const sp=Math.hypot(car.vx,car.vz);
 if(racing){timer+=dt;
  if(thr&&sp<1.2){stuck+=dt;if(stuck>3)resetCar()}else stuck=0;
  if(Math.abs(vl)>5&&sp>14){drift+=dt*Math.abs(vl);smokeT-=dt;if(smokeT<=0){smokeT=.04;for(const sd of[-1,1])puff(car.x-fx*1.3+lx*sd*.9,car.z-fz*1.3+lz*sd*.9)}}
  // AI
  ais.forEach(a=>{if(a.fin)return;const i=a.s|0,f=curv[i%N];const tv=AIV[S.diff]*a.k*(1-Math.min(.42,f*3.6));a.v+=(tv-a.v)*Math.min(1,dt*1.5);a.s+=a.v*dt/SP;
   if(a.s>=tot*N){a.fin=true;a.v*=.5}});
  ais.forEach(a=>{const q=a.s,i=Math.floor(q),fr=q-i,p0=place(i,a.off),p1=place(i+1,a.off);a.m.g.position.set(p0.x+(p1.x-p0.x)*fr,0,p0.z+(p1.z-p0.z)*fr);let dh=p1.h-p0.h;dh=Math.atan2(Math.sin(dh),Math.cos(dh));a.m.g.rotation.y=p0.h+dh*fr;
   a.m.piv.forEach(p=>p.rotation.y=Math.max(-.5,Math.min(.5,dh*60)));a.m.spin.forEach(w=>w.rotation.x+=a.v*dt/.4);
   const dx=car.x-a.m.g.position.x,dz=car.z-a.m.g.position.z,d=Math.hypot(dx,dz);if(d<2.7&&d>.01){car.x+=dx/d*(2.7-d);car.z+=dz/d*(2.7-d);car.vx*=.97;car.vz*=.97;sfx(120,.12,.2)}})}
 // visuals
 const P=player;P.g.position.set(car.x,0,car.z);P.g.rotation.y=car.h;
 P.piv.forEach(p=>p.rotation.y=steerCur*.55);spin+=vf*dt/.4;P.spin.forEach(w=>w.rotation.x=spin);
 P.body.rotation.z=THREE.MathUtils.lerp(P.body.rotation.z,-steerCur*Math.min(1,sp/40)*.05+vl*.004,Math.min(1,dt*6));
 P.body.rotation.x=THREE.MathUtils.lerp(P.body.rotation.x,(brk?.03:thr?-.02:0),Math.min(1,dt*5));
 P.tail.color.setHex(brk?0xff1a2a:0x661018);P.glow.material.opacity=.3+.15*Math.sin(performance.now()/300);
 smoke.forEach(s=>{if(s.userData.l>0){s.userData.l-=dt*1.1;s.material.opacity=Math.max(0,s.userData.l*.45);s.scale.addScalar(dt*4)}else s.material.opacity=0});
 // camera
 let dh=car.h-camH;dh=Math.atan2(Math.sin(dh),Math.cos(dh));camH+=dh*(1-Math.exp(-5*dt));
 const cs=Math.sin(camH),cc=Math.cos(camH),sf=Math.min(1,sp/78);
 const cfg=[[8.5,3.3],[6,2.1],[-.4,1.2]][camMode];
 cam.position.set(car.x-cs*cfg[0],cfg[1],car.z-cc*cfg[0]);cam.lookAt(car.x+cs*(camMode==2?20:6),camMode==2?1.1:1.2,car.z+cc*(camMode==2?20:6));
 cam.fov=THREE.MathUtils.lerp(cam.fov,62+sf*18+(nit?10:0),Math.min(1,dt*4));cam.updateProjectionMatrix();
 // audio
 const kmh=sp*3.6,ratio=Math.min(1,kmh/(topM*3.6)),gi=Math.min(6,1+Math.floor(ratio*6)),fr2=(ratio*6)%1,rpm=sp<1?1000:1500+fr2*6500;
 if(AC&&engG){eng.frequency.value=40+rpm*.028;engG.gain.value=state==='menu'?0:.03+(thr?.05:0)+.02*ratio}
 // HUD
 const U=S.units==='kmh';$s.spd.textContent=Math.round(U?kmh:sp*2.237);$s.unit.textContent=U?'km/h':'mph';
 $s.gear.textContent=vf<-.5?'R':sp<.8?'N':gi;$s.rpm.textContent=Math.round(rpm);$s.rb.style.width=(rpm/80)+'%';$s.nb.style.width=car.nit+'%';
 let pos=1;if(mode==='quick'){ais.forEach(a=>{if(a.s>prog+(state==='done'?0:0))pos++});if(state==='done')pos=finPos}
 let h=mode==='free'?'FREE ROAM':`${mode==='quick'?'QUICK RACE · POS '+pos+'/'+(ais.length+1)+'<br>':'TIME TRIAL<br>'}LAP ${Math.min(lap,tot)}/${tot}<br>TIME ${fmt(timer)}<br>LAP ${fmt(timer-lapT)}<br>BEST ${fmt(best)}`;
 $s.tl.innerHTML=h;
 drawMM()}
function resetCar(){const nr=nearest(car.x,car.z),g=place(nr.i,0);Object.assign(car,{x:g.x,z:g.z,h:g.h,vx:0,vz:0});stuck=0}
/* minimap */
const mm=$('mmc').getContext('2d');let bx=[1e9,-1e9,1e9,-1e9];pts.forEach(p=>{bx[0]=Math.min(bx[0],p.x);bx[1]=Math.max(bx[1],p.x);bx[2]=Math.min(bx[2],p.z);bx[3]=Math.max(bx[3],p.z)});
const sc=118/Math.max(bx[1]-bx[0],bx[3]-bx[2]),mp=(x,z)=>[6+(x-bx[0])*sc,124-(z-bx[2])*sc];
function drawMM(){mm.clearRect(0,0,130,130);mm.strokeStyle='#18f0ff';mm.lineWidth=3;mm.beginPath();pts.forEach((p,i)=>{const q=mp(p.x,p.z);i?mm.lineTo(q[0],q[1]):mm.moveTo(q[0],q[1])});mm.closePath();mm.stroke();
 const dot=(x,z,c)=>{const q=mp(x,z);mm.fillStyle=c;mm.beginPath();mm.arc(q[0],q[1],4,0,7);mm.fill()};ais.forEach(a=>dot(a.m.g.position.x,a.m.g.position.z,'#ff2d6f'));dot(car.x,car.z,'#fff')}

/* ---------- UI wiring ---------- */
function ui(){$('coins').textContent=S.coins;const sw=$('sw');sw.innerHTML='';COLORS.forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(i==S.color?' sel':'');b.style.background='#'+c.toString(16).padStart(6,'0');b.onclick=()=>{S.color=i;recolor();save();ui()};sw.appendChild(b)});
 $('up1').textContent=`ENGINE Lv${S.eng}/4 `+(S.eng<4?`(💰${250*(S.eng+1)})`:'MAX');$('up2').textContent=`TOP SPEED Lv${S.top}/4 `+(S.top<4?`(💰${250*(S.top+1)})`:'MAX');
 $('diff').textContent='AI: '+DIFF[S.diff];$('units').textContent=S.units==='kmh'?'KM/H':'MPH';$('mute').textContent=S.mute?'🔇 MUTED':'🔊 MUSIC ON';$('vol').value=S.vol*100}
const buy=k=>{const l=S[k];if(l>=4)return;const c=250*(l+1);if(S.coins>=c){S.coins-=c;S[k]++;save();ui()}else $('err').textContent='Not enough coins — win races to earn more!'};
$('up1').onclick=()=>buy('eng');$('up2').onclick=()=>buy('top');
$('diff').onclick=()=>{S.diff=(S.diff+1)%3;save();ui()};$('units').onclick=()=>{S.units=S.units==='kmh'?'mph':'kmh';save();ui()};
$('mute').onclick=()=>{initAudio();S.mute=!S.mute;setVol();save();ui()};$('vol').oninput=e=>{initAudio();S.vol=e.target.value/100;setVol();save()};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>startRace(b.dataset.m));
function pause(on){if(state==='race'||state==='count'){state='pause';$('pause').classList.add('on')}else if(state==='pause'&&on!==true){state=cd>0?'count':'race';$('pause').classList.remove('on')}}
let pre='race';const togglePause=()=>{if(state==='pause'){state=pre;$('pause').classList.remove('on')}else if(state==='race'||state==='count'){pre=state;state='pause';$('pause').classList.add('on')}};
$('pb').onclick=togglePause;$('resume').onclick=togglePause;$('restart').onclick=()=>startRace(mode);$('exit').onclick=toMenu;$('again').onclick=()=>startRace(mode);$('exit2').onclick=toMenu;
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();K[e.code]=1;
 if(e.code==='KeyC')camMode=(camMode+1)%3;if(e.code==='KeyR'&&state==='race')resetCar();if(e.code==='Escape')togglePause()});
addEventListener('keyup',e=>K[e.code]=0);
document.querySelectorAll('.tb').forEach(b=>{const k=b.dataset.k,on=v=>e=>{e.preventDefault();T[k]=v;b.classList.toggle('d',!!v)};b.addEventListener('pointerdown',on(1));['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,on(0)))});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();

/* ---------- loop ---------- */
let last=performance.now(),menuA=0;
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;
 if(state==='menu'){menuA+=dt*.35;player.g.position.set(0,0,0);player.g.rotation.y=0;car.x=0;car.z=0;player.spin.forEach(w=>w.rotation.x+=dt*3);player.piv.forEach(p=>p.rotation.y=Math.sin(menuA*3)*.4);
  const r=11;cam.position.set(Math.sin(menuA)*r,3.2,Math.cos(menuA)*r);cam.lookAt(0,.8,0);player.g.position.set(pts[0].x,0,pts[0].z);cam.position.add(pts[0]);cam.lookAt(pts[0].x,.8,pts[0].z)}
 else if(state!=='pause')update(dt);
 R.render(scene,cam)}
ui();recolor();requestAnimationFrame(loop);
}catch(err){$('err').textContent='Something went wrong starting the game: '+err.message}
</script></body></html>
